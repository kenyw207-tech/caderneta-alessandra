<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D203E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Caderneta de Contas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral clara com a logo (vira cabeçalho no celular) + área de trabalho em tons de pérola, barra do mês fixa e painéis de dashboard */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#14294B; --mute:#64748B; --line:#E3E8F0; --tint:#EEF2F8;
  --gold:#C9A15A; --gold-ink:#8A6120; --gold-soft:#F8F0DD; --gold-line:#EBDDB9;
  --c1:#2B4F86; --c3:#D7DFEB; --good:#1E7A4C; --warn:#A5680D; --bad:#B03A2E;
  --shadow:0 1px 2px rgba(20,41,75,.05),0 12px 30px -16px rgba(20,41,75,.20);
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.ic{display:inline-block;vertical-align:-3px;flex:0 0 auto}
/* barra lateral */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:24px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;min-width:0}
.brand{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.plaque{background:#FDFEFC;border:1px solid var(--gold-line);border-radius:16px;padding:8px 14px}
.plaque img{display:block;height:66px;width:auto}
.bt b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.1;color:var(--ink)}
.bt span{display:block;margin-top:6px;font-size:.64rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
nav{display:flex;flex-direction:column;gap:2px;min-width:0}
.ng{font-size:.62rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);opacity:.8;padding:14px 10px 5px}
nav button{display:flex;align-items:center;gap:11px;font:inherit;font-weight:500;font-size:.88rem;padding:8px 10px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
nav button .ni{width:28px;height:28px;border-radius:9px;background:var(--tint);color:var(--c1);display:grid;place-items:center;flex:0 0 auto}
nav button .ni .ic{width:16px;height:16px;vertical-align:0}
nav button:hover{background:var(--tint)}
nav button[aria-current="true"]{background:var(--gold-soft);border-color:var(--gold-line);font-weight:700}
nav button[aria-current="true"] .ni{background:var(--ink);color:var(--gold-soft)}
.side-foot{margin-top:auto;display:flex}
.chip{font-size:.72rem;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;background:var(--surface)}
.chip.ok{color:var(--good)} .chip.err{color:var(--bad)} .chip.warn{color:var(--gold-ink);border-color:var(--gold-line);background:var(--gold-soft)}
/* conteúdo */
.content{padding:0 clamp(14px,3vw,36px) 64px;display:flex;flex-direction:column;gap:18px;min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .sp{flex:1}
select{font:inherit;font-weight:600;padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input:focus-visible,select:focus-visible{outline:none}
select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,161,90,.22)}
::placeholder{color:#9AA8BC;opacity:1}
.btn{font:inherit;font-size:.8rem;font-weight:600;padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn .ic{width:15px;height:15px;vertical-align:0}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.gold{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
.btn.soft{color:var(--mute);font-weight:500} .btn.sure{color:var(--bad);border-color:var(--bad)}
h2{font-family:var(--f-display);font-size:1.8rem;line-height:1.1;margin:0;font-weight:700;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.15rem;margin:0;font-weight:700}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
.head p{margin:8px 0 0;color:var(--mute);font-size:.86rem;max-width:64ch}
.rule{height:2px;width:46px;background:var(--gold);border-radius:2px;margin-top:10px}
.total{font-weight:700;font-size:1rem}
/* hero */
.hero{border-radius:22px;padding:clamp(18px,3vw,30px);color:var(--ink);background:radial-gradient(110% 130% at 100% 0%,#F6E7C2 0%,transparent 58%),linear-gradient(135deg,#FFFFFF,#FBF4E3);border:1px solid var(--gold-line);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
.big{display:block;font-weight:700;font-size:clamp(2.2rem,6.5vw,3.3rem);line-height:1.05;letter-spacing:-.02em;margin-top:8px;color:var(--ink);overflow-wrap:anywhere}
.hero .sm{color:var(--mute);font-size:.85rem;margin:8px 0 0}
.glass{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-content:center}
.glass div{background:rgba(255,255,255,.85);border:1px solid var(--gold-line);border-radius:14px;padding:12px 14px;min-width:0}
.glass span{display:block;font-size:.72rem;color:var(--mute)}
.glass .ic{width:13px;height:13px;vertical-align:-2px;color:var(--gold-ink)}
.glass b{display:block;font-weight:700;font-size:1.05rem;margin-top:3px;overflow-wrap:anywhere}
.alert-b{border:1px solid var(--bad);color:var(--bad);border-radius:14px;padding:11px 16px;font-size:.88rem;background:var(--surface)}
.alert-b .ic{vertical-align:-3px;margin-right:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 16px;min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.tile .ti{width:32px;height:32px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center}
.tile .ti .ic{width:17px;height:17px;vertical-align:0}
.tile span.l{font-size:.76rem;font-weight:500;color:var(--mute)}
.tile b{font-weight:700;font-size:1.2rem;overflow-wrap:anywhere}
.tile.alert{border-color:var(--bad)} .tile.alert b{color:var(--bad)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.cat{display:flex;flex-direction:column;gap:7px}
.cat .l{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;align-items:center}
.cat .l span{display:flex;align-items:center;gap:8px}
.cat .l .ic{width:16px;height:16px;color:var(--c1);vertical-align:0}
.cat .l b{font-weight:600;font-size:.82rem;text-align:right}
.track{height:10px;border-radius:99px;background:var(--c3);overflow:hidden;display:flex}
.track .p{background:var(--c1)} .track .o{background:var(--gold)} .track .o.late{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mute);font-size:10px;font-family:var(--f-body)}
svg.ch .sd{fill:var(--c3)} svg.ch .sp2{fill:var(--c1)} svg.ch .sg{fill:var(--gold)} svg.ch line{stroke:var(--line)}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;position:relative;flex:0 0 auto;background:var(--line)}
.donut::after{content:"";position:absolute;inset:27px;border-radius:50%;background:var(--surface)}
.dl{display:flex;flex-direction:column;gap:9px;font-size:.88rem;min-width:0;flex:1}
.dl div{display:flex;gap:8px;align-items:center}
.dl i{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.dl b{font-weight:600;margin-left:auto;padding-left:10px}
.due{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.due:last-child{border-bottom:0}
.due .d{color:var(--mute);min-width:3.6em;font-size:.82rem}
.due .n{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.due .n .ic{width:16px;height:16px;color:var(--c1);vertical-align:0}
.due .v{font-weight:600;font-size:.9rem;white-space:nowrap}
.grp{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--mute);margin:8px 0 0}
.grp .ic{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.row header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px;flex:1;min-width:150px}
.emo{width:38px;height:38px;border-radius:12px;background:var(--tint);color:var(--c1);display:grid;place-items:center;flex:0 0 auto}
.emo .ic{width:19px;height:19px;vertical-align:0}
.name{font:inherit;font-family:var(--f-display);font-weight:700;font-size:1.2rem;background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0;color:var(--ink);min-width:0;flex:1;padding:3px 0}
.name:hover{border-bottom-color:var(--line)} .name:focus{border-bottom-color:var(--gold);outline:none}
.acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span:first-child{font-size:.72rem;font-weight:600;color:var(--mute)}
.inp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;background:#FAFBFD;transition:border-color .15s,box-shadow .15s}
.inp:focus-within,.fld>input:focus,.fld>select:focus,.add input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,161,90,.22);background:#fff}
.inp i{font-style:normal;color:var(--mute);font-size:.8rem;font-weight:600}
.inp input{font:inherit;font-weight:600;font-size:.93rem;color:var(--ink);background:transparent;border:0;outline:none;padding:10px 0;width:100%;min-width:0;border-radius:0}
.inp input.inh{color:var(--mute);font-style:italic;font-weight:500}
.inp .x{display:grid;place-items:center;border:0;background:transparent;color:#9AA8BC;cursor:pointer;padding:6px;border-radius:8px;flex:0 0 auto}
.inp .x .ic{width:13px;height:13px;vertical-align:0}
.inp .x:hover{color:var(--bad);background:var(--tint)}
.fld>input,.fld>select{font:inherit;font-weight:500;font-size:.93rem;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#FAFBFD;width:100%;outline:none}
.fld.chk{flex-direction:row;align-items:center;gap:8px;padding-top:20px}
.fld.chk input{width:18px;height:18px;accent-color:var(--c1);padding:0}
.fld.chk span{font-size:.86rem;color:var(--ink);font-weight:500}
.fld.chk span .ic{width:15px;height:15px;color:var(--c1)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.mini div{background:var(--tint);border-radius:13px;padding:9px 12px;min-width:0}
.mini span{display:block;font-size:.7rem;font-weight:500;color:var(--mute)}
.mini .ic{width:13px;height:13px;vertical-align:-2px;margin-right:3px;color:var(--c1)}
.mini b{font-weight:700;font-size:.92rem;overflow-wrap:anywhere}
.stline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:.76rem;font-weight:600;border-radius:99px;padding:4px 11px;border:1px solid currentColor}
.pill .ic{width:14px;height:14px;vertical-align:0;margin:0}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mute{color:var(--mute)}
.foot{margin:0;font-size:.85rem;color:var(--mute)}
.foot b{font-weight:700;color:var(--ink)}
.foot .ic{width:14px;height:14px;color:var(--gold-ink);vertical-align:-2px;margin-right:2px}
.bar{height:6px;border-radius:99px;background:var(--c3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--gold))}
.bar.hot i{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pc{font:inherit;font-size:.72rem;font-weight:700;border-radius:11px;padding:6px 9px;border:1px solid var(--line);background:#FAFBFD;color:var(--mute);cursor:pointer;text-align:center;min-width:56px;line-height:1.25}
.pc small{display:block;font-size:.62rem;font-weight:500;opacity:.85}
.pc.ok{background:var(--good);border-color:var(--good);color:#fff}
.pc.part{background:var(--warn);border-color:var(--warn);color:#fff}
.pc.late{background:#fff;border-color:var(--bad);color:var(--bad)}
.pc.cur{box-shadow:0 0 0 2px var(--gold)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;padding:11px 13px;border:1px dashed #C4CEDD;border-radius:13px;background:var(--surface);color:var(--ink);outline:none}
.group{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 20px;box-shadow:var(--shadow)}
.calc .ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.calc .ln:last-child{border-bottom:0}
.calc .ln>span:first-child,.calc .ln label.c{display:flex;gap:10px;align-items:center;min-width:0}
.calc .ln .ic{width:16px;height:16px;color:var(--c1);vertical-align:0}
.calc .ln input[type=checkbox]{width:18px;height:18px;accent-color:var(--c1)}
.calc .v{white-space:nowrap;font-weight:600}
.calc .end{font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.empty{color:var(--mute);font-size:.9rem;padding:8px 0;margin:0}
.note{font-size:.82rem;color:var(--mute);margin:0}
.banner{border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold-ink);border-radius:12px;padding:9px 14px;font-size:.84rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.88rem;z-index:40;max-width:90vw}
@media (max-width:959px){
  .layout{display:block}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line);flex-direction:column;gap:8px;padding:10px max(14px,env(safe-area-inset-left,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
  .brand{flex-direction:row;align-items:center;gap:10px}
  .plaque{padding:3px 8px;border-radius:11px} .plaque img{height:34px}
  .bt b{font-size:1.1rem} .bt span{font-size:.56rem;margin-top:2px}
  nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  nav button{flex:0 0 auto;padding:6px 10px;white-space:nowrap} .ng{display:none}
  nav button .ni{width:24px;height:24px;border-radius:8px}
  .side-foot{position:absolute;top:12px;right:14px;margin:0}
  .topbar{top:calc(env(safe-area-inset-top,0px) + var(--sideh,110px))}
  .hero{grid-template-columns:minmax(0,1fr)}
  h2{font-size:1.5rem}
}

.bgrid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.bcard .bh{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.bcard .bh span:last-child{overflow-wrap:anywhere}
.bcard .bal{font-family:var(--f-display);font-size:1.5rem;font-weight:700;overflow-wrap:anywhere;line-height:1.15}
.bio{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.76rem;color:var(--mute);margin-top:4px}
.bio b{color:var(--ink);font-weight:700}
.bio .in b{color:var(--good)} .bio .out b{color:var(--bad)}
details.adj{border-top:1px dashed var(--line);padding-top:8px}
details.adj>summary{cursor:pointer;font-size:.78rem;font-weight:600;color:var(--gold-ink);list-style:none;display:inline-block;padding:4px 0}
details.adj>summary::-webkit-details-marker{display:none}
details.adj>summary::after{content:" \25BE"}
details.adj[open]>summary{margin-bottom:10px}
details.adj[open]>summary::after{content:" \25B4"}
details.adj>*+*{margin-top:10px}
.vo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.vo div{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:13px;padding:9px 12px;min-width:0}
.vo span{display:block;font-size:.7rem;color:var(--gold-ink);font-weight:600}
.vo b{font-size:.95rem;font-weight:700;overflow-wrap:anywhere}
.lk{font:inherit;font-size:.78rem;color:var(--gold-ink);font-weight:600;background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
.vlist{display:flex;flex-direction:column}
.vl{display:flex;align-items:center;gap:8px 12px;padding:10px 0 4px;flex-wrap:wrap}
.vl .vn{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.vl .vn b{font-weight:600}
.vl .vn small{color:var(--mute);font-size:.75rem}
.vl .vv{font-weight:700;white-space:nowrap;min-width:6.5em;text-align:right}
.vlist details.adj{border-top:0;padding-top:0;border-bottom:1px solid var(--line);padding-bottom:6px}
.qa{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cfr{display:grid;grid-template-columns:minmax(130px,1.2fr) 1fr 1fr;gap:12px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.cfr .cn{display:flex;align-items:center;gap:8px;font-weight:600;padding-bottom:10px;min-width:0;overflow-wrap:anywhere}
.cfr .cn .ic{width:17px;height:17px;color:var(--c1);vertical-align:0}
.warnline{color:var(--warn)}
@media (max-width:640px){.cfr{grid-template-columns:1fr 1fr}.cfr .cn{grid-column:1/-1;padding-bottom:0}}
.bdg{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:.64rem;font-weight:800;letter-spacing:-.02em;flex:0 0 auto;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.emo .bdg{width:100%;height:100%;border-radius:12px;font-size:.8rem}
.bl{font-size:.7rem;color:var(--mute);font-weight:600;margin-bottom:-4px}
.addc{display:grid;grid-template-columns:2fr 1fr .8fr 1fr auto;gap:8px}
.addc input{min-width:0;font:inherit;padding:10px 12px;border:1px dashed #C4CEDD;border-radius:12px;background:var(--surface);color:var(--ink);outline:none}
.addc input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,161,90,.22)}
.cfr{grid-template-columns:minmax(130px,1.2fr) 1fr 1fr 1fr}
@media (max-width:720px){.cfr{grid-template-columns:1fr 1fr}.addc{grid-template-columns:1fr 1fr}.addc input[name=nome],.addc button{grid-column:1/-1}}
.pend{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:14px;padding:6px 14px 4px}
.pend>.foot{margin-top:8px}
.nb{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.68rem;font-weight:700;padding:1px 7px;line-height:1.5}
.confirm{background:#FBEDEA;border:1px solid #E8B8B0;border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:12px 0}
.confirm p{margin:0;font-size:.86rem;color:#7A2A20;flex:1;min-width:220px}
.confirm p .ic{width:15px;height:15px;vertical-align:-3px}

.fld>input,.fld>select,.mp select{min-height:44px}
.mp{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.mp select{font:inherit;font-weight:500;font-size:.93rem;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#FAFBFD;width:100%;outline:none}
.mp select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,161,90,.22);background:#fff}
input.dt{cursor:pointer}
.addc input.bad,.fld input.bad{border-color:var(--bad)!important;box-shadow:0 0 0 3px rgba(190,60,50,.18)!important}
.addc input[type=date]{min-width:0}
</style>

  if(b.kind==='invest') return {inn:flow(b,mo,'aporte'),out:flow(b,mo,'resgate')};
  if(b.kind==='vale') return {inn:flow(b,mo,'entrada'),out:flow(b,mo,'saida')+comprasFor(b,mo)+fixasOf(b.id).filter(f=>fixActive(f,mo)).reduce((s,f)=>s+(Number(f.valor)||0),0)};
  let inn=flow(b,mo,'entrada'), out=flow(b,mo,'saida');
  items.forEach(it=>{
    if(it.kind==='invest'){ if(it.conta===b.id){ out+=flow(it,mo,'aporte'); inn+=flow(it,mo,'resgate'); } return; }
    if(isR(it.kind)){ if(it.banco===b.id) inn+=flow(it,mo,'recebido'); return; }
    const p=paidFlow(it,mo); if(p>0&&payBank(it)===b.id) out+=p;
  });
  return {inn,out};
}
function bankBal(b,mo){
  const s=idxOf(bankIni(b)), e=idxOf(mo); let run=Number(b.saldoIni)||0;
  for(let i=s;i<=e;i++){
    const k=keyOf(i), io=bankIO(b,k); run+=io.inn-io.out;
    const c=cell(b,k), cf=ckf(b); if(c[cf]!==undefined) run=Number(c[cf])||0;
  }
  return run;
}
function semConta(mo){
  let p=0,r=0;
  items.forEach(it=>{
    if(isR(it.kind)){ if(!(it.banco&&items.get(it.banco))) r+=flow(it,mo,'recebido'); }
    else { const x=paidFlow(it,mo); if(x>0&&!payBank(it)) p+=x; }
  });
  return {p,r};
}
function obraPago(o,mo){
  const cd=o.cartao&&items.get(o.cartao);
  if(cd&&cd.kind==='card'){ if(o.aprov===false) return 0; return idxOf(mo)>=idxOf((o.data||todayISO()).slice(0,7))?(Number(o.total)||0):0; }
  return (Number(o.pago)||0)+Object.keys(o.m||{}).filter(k=>k<=mo).reduce((s,k)=>s+(Number(o.m[k].pagoMes)||0),0);
}
function status(it,mo,inf){
  const R=isR(it.kind);
  const L=R?{ok:'recebido',part:'recebido em parte',late:'em atraso, não pagou',lateP:'parcial e em atraso',soon:'a receber',none:'sem lançamento'}:
            {ok:'pago',part:'pago parcial',late:'em atraso',lateP:'parcial e em atraso',soon:'a vencer',none:'sem lançamento'};
  if(inf.due+inf.carry<=0.005&&inf.paid<=0.005) return [''+ic('none')+'',L.none,'mute'];
  if(inf.aberto<=0.005) return [''+ic('check')+'',L.ok,'good'];
  const dd=it.venc||it.dia||0;
  const late=inf.carry>0.005||idxOf(mo)<idxOf(CUR)||(mo===CUR&&dd>0&&dd<CD);
  if(late) return inf.paid>0?[''+ic('half')+'',L.lateP,'bad']:[''+ic('alertc')+'',L.late,'bad'];
  return inf.paid>0?[''+ic('half')+'',L.part,'warn']:[''+ic('clock')+'',L.soon,'warn'];
}

function calc(){
  const c=cfg(), ct=cats(sel), rt=cats(sel,RCATS);
  let entrou=0,saiu=0;
  const bancos=sum(all('bank'),b=>{const io=bankIO(b,sel); entrou+=io.inn; saiu+=io.out; return bankBal(b,sel);});
  const vale=sum(all('vale'),i=>bankBal(i,sel));
  const investBanco=sum(all('invest').filter(i=>i.local!=='cofre'),i=>bankBal(i,sel));
  const cofre=sum(all('invest').filter(i=>i.local==='cofre'),i=>bankBal(i,sel));
  const obraAPagar=sum(all('obra'),o=>Math.max((o.total||0)-obraPago(o,sel),0));
  const quemMeDeve=sum(all('div'),divFalta);
  let livre=bancos;
  if(c.t_faturas) livre-=ct.card.aberto;
  if(c.t_contas) livre-=ct.casa.aberto;
  if(c.t_parcelas) livre-=ct.loan.aberto+ct.veic.aberto;
  if(c.t_obra) livre-=obraAPagar;
  if(c.t_receber) livre+=rt.tot.aberto;
  livre-=Number(c.reserva)||0;
  return {c,ct,rt,entrou,saiu,bancos,vale,investBanco,cofre,obraAPagar,quemMeDeve,livre};
}

    if(it.total>0&&d>=n) return 'Consórcio encerrado';

function dataToBlob(uri){
  const p=uri.split(','), mime=p[0].match(/:(.*?);/)[1], bin=atob(p[1]), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:mime});
}
async function saveFile(name,blob){
  let dl=null;
  if(!OFFLINE){ try{dl=await claude.use('downloads');}catch(e){} }
  if(dl){
    try{ await dl.save({filename:name,data:blob}); toast('Arquivo pronto: '+name); }
    catch(e){ if(!e||e.code!=='declined') toast('Não consegui baixar o arquivo por aqui.'); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();

}

    const ws=XLSX.utils.aoa_to_sheet([head].concat(rows));
    rows.forEach((r,ri)=>num.forEach(c=>{const a=XLSX.utils.encode_cell({r:ri+1,c}); if(ws[a]&&typeof ws[a].v==='number'){ws[a].z='"R$" #,##0.00';}}));

async function start(){
  render();
  if(OFFLINE){ memoryMode('Seus dados ficam salvos só neste aparelho. Baixe o Excel de vez em quando para ter uma cópia de segurança.'); return; }
  let db=null,user=null,uid=null;
  try{ db=await claude.use('db'); user=await claude.use('user'); uid=user?await user.id():null; }catch(e){}
  if(!db||!uid){ memoryMode('Você não está conectado, então os dados ficam só neste navegador. Abra o link logado na sua conta do Claude para guardar na sua conta.'); return; }
  col=db.collection('data/users/'+uid);
  col.onSnapshot(snap=>{
    const m=new Map(); const fix=[];
    snap.docs.forEach(d=>{const x=d.data(); if(!x) return; const it=clone(Object.assign({id:d.id},x)); if(migrate(it)) fix.push(it.id); m.set(d.id,it);});
    items=m;
    if(!items.has('cfg')&&!seeding){ seed(); }
    fix.forEach(id=>persist(id));
    if(items.has('cfg')||items.size) refresh();
    if(!seeding&&!fix.length) setStatus('ok');
  },()=>{ memoryMode('Não consegui abrir o armazenamento. Os dados ficam só neste navegador.'); });
}
start();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
